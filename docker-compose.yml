services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: skybox
      POSTGRES_PASSWORD: skybox
      POSTGRES_DB: skybox
    ports:
      # Bind localhost only — never expose Postgres on a public VPS
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skybox -d skybox"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # MinIO images were removed from Docker Hub / Quay anonymous pulls.
  # Silo is an S3-compatible MinIO fork drop-in (same env + console).
  minio:
    image: pgsty/silo:latest
    restart: unless-stopped
    profiles: ["local-s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: skybox
      MINIO_ROOT_PASSWORD: skyboxsecret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    # Silo image may not ship wget/curl; rely on port readiness via start retries in apps.

volumes:
  postgres_data:
  minio_data:
